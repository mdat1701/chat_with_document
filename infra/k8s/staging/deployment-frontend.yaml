apiVersion: apps/v1
kind: Deployment
metadata:
  name: cwd-web
  namespace: cwd-staging
spec:
  replicas: 2
  selector:
    matchLabels: { app: cwd-web }
  template:
    metadata:
      labels: { app: cwd-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/ORG/cwd-frontend:TAG
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: cwd-web
  namespace: cwd-staging
spec:
  selector: { app: cwd-web }
  ports: [{ port: 80, targetPort: 8080 }]
