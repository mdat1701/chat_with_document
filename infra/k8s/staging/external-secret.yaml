# External Secrets Operator đọc bí mật từ Vault — KHÔNG đặt bí mật vào
# ConfigMap hay Git (T-004 §5 bước 5). Giả định Operator + SecretStore
# cluster-wide đã được DevOps cài sẵn (ngoài phạm vi task này, phụ
# thuộc D-02).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: cwd-staging
spec:
  provider:
    vault:
      server: "https://vault.internal.example.com" # [TBD — DevOps điền khi D-02 chốt]
      path: "secret"
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: cwd-staging
          serviceAccountRef:
            name: cwd-backend
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cwd-secrets
  namespace: cwd-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: cwd-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: cwd-staging/database, property: url }
    - secretKey: WORKER_DATABASE_URL
      remoteRef: { key: cwd-staging/database, property: worker_url }
    - secretKey: REDIS_URL
      remoteRef: { key: cwd-staging/redis, property: url }
    - secretKey: CELERY_BROKER_URL
      remoteRef: { key: cwd-staging/redis, property: broker_url }
    - secretKey: S3_ENDPOINT
      remoteRef: { key: cwd-staging/object-storage, property: endpoint }
    - secretKey: S3_ACCESS_KEY
      remoteRef: { key: cwd-staging/object-storage, property: access_key }
    - secretKey: S3_SECRET_KEY
      remoteRef: { key: cwd-staging/object-storage, property: secret_key }
    - secretKey: TEI_EMBED_URL
      remoteRef: { key: cwd-staging/tei, property: url }
    - secretKey: CLAMAV_HOST
      remoteRef: { key: cwd-staging/clamav, property: host }
    - secretKey: OIDC_ISSUER
      remoteRef: { key: cwd-staging/oidc, property: issuer } # chờ D-03
    - secretKey: OIDC_CLIENT_ID
      remoteRef: { key: cwd-staging/oidc, property: client_id }
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: { key: cwd-staging/oidc, property: client_secret }
    - secretKey: ANALYTICS_HASH_SECRET
      remoteRef: { key: cwd-staging/analytics, property: hash_secret }
