name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "backend[dev]"
      - run: ruff check . && ruff format --check .
        working-directory: backend
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run lint && npm run format:check
        working-directory: frontend

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "backend[dev]"
      - run: mypy app
        working-directory: backend
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run typecheck
        working-directory: frontend

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "backend[dev]" import-linter
      - run: lint-imports
        working-directory: backend

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "backend[dev]"
      # Testcontainers cần Docker — có sẵn trên runner ubuntu-latest (T-003 §6).
      - run: pytest tests/unit tests/integration -m "not isolation" --junitxml=reports/be-junit.xml
        working-directory: backend
      - run: pytest tests/isolation -m isolation --junitxml=reports/be-isolation-junit.xml
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: junit-backend, path: backend/reports/ }

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run test -- --reporter=junit --outputFile=reports/fe-junit.xml
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: junit-frontend, path: frontend/reports/ }

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  sast:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config p/python --config p/typescript --config p/owasp-top-ten --error
        env: { SEMGREP_RULES: "" }

  build:
    needs: [lint, typecheck, boundaries, backend-test, frontend-test]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        # Một image api/worker (chỉ khác CMD) + một image front-end tĩnh
        # (SADD §4.4) — build cả hai trong cùng job để build() là một
        # cổng duy nhất trước khi merge (T-003 §2).
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.ref == 'refs/heads/main' }}
          load: ${{ github.ref != 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/cwd-${{ matrix.name }}:sha-${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/cwd-${{ matrix.name }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-artifacts, path: frontend/reports/ }

  rag-eval:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(join(github.event.pull_request.changed_files, ','), 'backend/app/modules/qa')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: python -m tools.evaluation.run_eval --datasets tools/evaluation/datasets/golden_set.yaml tools/evaluation/datasets/no_answer_set.yaml --base-url "$EVAL_BASE_URL" --cookie "$EVAL_COOKIE" --out tools/evaluation/reports/ci-${{ github.sha }}.json
        env:
          EVAL_BASE_URL: ${{ secrets.EVAL_BASE_URL }}
          EVAL_COOKIE: ${{ secrets.EVAL_COOKIE }}
      - uses: actions/upload-artifact@v4
        with: { name: rag-evaluation, path: tools/evaluation/reports/ }
