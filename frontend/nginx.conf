# SPA: mọi route không khớp file tĩnh trả về index.html (React Router).
# index.html KHÔNG được cache (T-003 §DoD SADD §4.4 — "index.html
# không bị cache" để người dùng tự nhận bản mới khi tải lại trang).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Tệp có hash trong tên (Vite build) — cache dài hạn.
    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
